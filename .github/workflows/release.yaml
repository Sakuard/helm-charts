name: Check and Release Helm Charts

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: helm-chart-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect chart changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      chart_changed: ${{ steps.changes.outputs.chart_changed }}
      version_changed: ${{ steps.changes.outputs.version_changed }}
      requires_confirmation: ${{ steps.changes.outputs.requires_confirmation }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect chart and version changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          chart_changed=false
          version_changed=false

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            # The first commit introduces the chart and its initial version.
            chart_changed=true
            version_changed=true
          else
            if ! git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- common; then
              chart_changed=true
            fi

            old_version=""
            if old_chart=$(git show "${BEFORE_SHA}:common/Chart.yaml" 2>/dev/null); then
              old_version=$(printf '%s\n' "$old_chart" | awk '$1 == "version:" { print $2; exit }' | tr -d '"')
            fi
            new_version=$(awk '$1 == "version:" { print $2; exit }' common/Chart.yaml | tr -d '"')

            if [[ "$old_version" != "$new_version" ]]; then
              version_changed=true
            fi
          fi

          requires_confirmation=false
          if [[ "$chart_changed" == "true" && "$version_changed" == "false" ]]; then
            requires_confirmation=true
          fi

          {
            echo "chart_changed=$chart_changed"
            echo "version_changed=$version_changed"
            echo "requires_confirmation=$requires_confirmation"
          } >> "$GITHUB_OUTPUT"

          if [[ "$requires_confirmation" == "true" ]]; then
            {
              echo "Chart release confirmation is required. Approve the protected environment job to continue."
              echo
              echo 'chart 有異動，但 helm-chart 版本為更新確定要發佈嗎？'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  confirm:
    name: Confirm Helm chart release
    needs: detect
    if: needs.detect.outputs.requires_confirmation == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: helm-chart-release
    permissions:
      contents: read

    steps:
      - name: Confirmation approved
        run: echo "Helm chart release confirmation approved."

  release-automatic:
    name: Release Helm chart
    needs: detect
    if: needs.detect.outputs.chart_changed == 'true' && needs.detect.outputs.requires_confirmation == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Lint common chart
        run: helm lint common

      - name: Package common chart
        run: |
          mkdir -p .cr-release-packages
          helm package common --destination .cr-release-packages

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Ensure GitHub Pages branch exists
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            exit 0
          fi

          git push origin "HEAD:refs/heads/gh-pages"

      - name: Publish chart release and index
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: .
          skip_packaging: true
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

  release-confirmed:
    name: Release Helm chart after confirmation
    needs:
      - detect
      - confirm
    if: needs.detect.outputs.requires_confirmation == 'true' && needs.confirm.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Bump chart patch version after confirmation
        env:
          CHART_PATH: common/Chart.yaml
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          remote_sha=$(git ls-remote origin refs/heads/main | awk '{ print $1 }')
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo "main changed after confirmation request; rerun the workflow for the latest commit" >&2
            exit 1
          fi

          current_version=$(awk '$1 == "version:" { print $2; exit }' "$CHART_PATH" | tr -d '"')
          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Unsupported chart version: $current_version" >&2
            exit 1
          fi

          patch_version=$((10#${BASH_REMATCH[3]} + 1))
          next_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${patch_version}"
          sed -i.bak -E "s/^version:[[:space:]]*.*/version: ${next_version}/" "$CHART_PATH"
          rm -f "${CHART_PATH}.bak"

          git add "$CHART_PATH"
          git commit -m "chore: bump common chart version to ${next_version} [skip ci]"
          git push origin HEAD:main

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Lint common chart
        run: helm lint common

      - name: Package common chart
        run: |
          mkdir -p .cr-release-packages
          helm package common --destination .cr-release-packages

      - name: Ensure GitHub Pages branch exists
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            exit 0
          fi

          git push origin "HEAD:refs/heads/gh-pages"

      - name: Publish chart release and index
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: .
          skip_packaging: true
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
